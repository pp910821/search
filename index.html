  const msg=t=>{$('p-msg').textContent=t},v=i=>$(i).value;
  const jin=async()=>{let o;try{o=JSON.parse(v('p-j'))}catch(x){return msg('JSON 格式錯誤。')}
    const A=Array.isArray(o)?o:Array.isArray(o&&o.items)?o.items:null;if(!A)return msg('找不到五金陣列。');
    let ok=0,bad=0;msg('匯入中…');for(const it of A){const c=cleanItem(it);if(!c){bad++;continue}try{await W('items/'+(it&&idOk(it.id)?it.id:newId()),c,'JSON匯入');ok++}catch(x){bad++}}
    msg(`匯入完成：成功 ${ok} 筆，略過／失敗 ${bad} 筆。`)};
  $('pg-b').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
    if(b.id==='p-add'){const d=cleanItem({sheet:v('p-s'),t:v('p-t'),c:v('p-cn').trim()||v('p-c'),n:v('p-n'),b:v('p-b'),m:lines(v('p-m')),s:lines(v('p-z')),r:lines(v('p-r'))});
      if(!d)return msg('請至少填入名稱。');
      try{await W('items/'+newId(),d,'新增五金');msg('已新增到 '+d.sheet+' 頁。');['p-n','p-b','p-m','p-z','p-r','p-cn'].forEach(i=>$(i).value='')}catch(x){msg('儲存失敗，請確認你有編輯權限。')}}
    else if(b.id==='p-tp')dlTable([HD,['','F14','S03','門鎖','範例名稱','廠牌','型號1\n型號2','1260*2555以下','備註1\n備註2']],'五金匯入範本');
    else if(b.id==='p-ex')csvOut();else if(b.id==='p-ji')jin()};
  $('p-xf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;msg('匯入中…');
    try{let rows;if(/\.csv$/i.test(f.name))rows=csvParse(await f.text());else{if(!window.XLSX)return msg('Excel 元件未載入（需連網），請改用 .csv。');const w=XLSX.read(await f.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{header:1,defval:''})}
      msg(await rowsIn(rows))}catch(x){msg('讀取失敗：'+(x.message||x))}};
  $('p-jf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f){$('p-j').value=await f.text();jin()}}}
