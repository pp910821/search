let auth=null;
const FB_OK=typeof firebase!=='undefined'&&!!FIREBASE_CONFIG.apiKey&&!/^YOUR/.test(FIREBASE_CONFIG.apiKey);
function setAdmin(on){admin=on;$('bk').hidden=!on;$('adm').textContent=on?'登出':'登入';say('');render()}
$('adm').onclick=()=>{
  if(admin){if(auth)auth.signOut();else setAdmin(false);return}
  if(!auth){say('尚未設定 Firebase，無法登入。請先在檔案開頭填入 FIREBASE_CONFIG。');return}
  $('m-form').onclick=null;$('m-form').onchange=null;
  $('m-form').innerHTML='<h2>登入</h2><div class="field"><label for="m-pw">密碼（有大小寫之分）</label><input id="m-pw" type="password" autocomplete="current-password"></div><p class="hint warn" id="m-err" hidden>登入失敗，請確認密碼。</p><div class="btns"><button class="btn go" type="submit">登入</button><button class="btn" type="button" id="m-x">取消</button></div>';
  $('m-form').onsubmit=async e=>{e.preventDefault();const pw=$('m-pw').value;
    try{await auth.signInWithEmailAndPassword(ADMIN_EMAIL,pw);closeModal()}
    catch(x){$('m-err').hidden=false;$('m-pw').value='';$('m-pw').focus()}};
  $('m-x').onclick=closeModal;$('modal').hidden=false;$('m-pw').focus()};
(async()=>{
  if(!FB_OK){say('尚未設定 Firebase：目前為唯讀，只顯示內建資料。');return}
  try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();auth=firebase.auth();
    auth.onAuthStateChanged(u=>setAdmin(!!u&&u.email===ADMIN_EMAIL))}catch(e){db=null;return}
  db.collection('overrides').onSnapshot(snap=>{ov={};snap.docs.forEach(d=>{const c=d.data()?.cat;if(typeof c==='string'&&c)ov[d.id]=c});applyOv()},()=>{});
  db.collection('notes').onSnapshot(snap=>{nv={};snap.docs.forEach(d=>{const t=d.data()?.text;if(typeof t==='string')nv[d.id]=t});render()},()=>{});
  db.collection('certs').onSnapshot(snap=>{certOv={};snap.docs.forEach(d=>{const x=d.data();if(x&&Array.isArray(x.w)&&Array.isArray(x.h)&&Array.isArray(x.note)){if(Array.isArray(x.tags))x.tags=x.tags.filter(t=>t&&typeof t.t==='string'&&okC(t.c));else delete x.tags;certOv[d.id]=x}});mkCerts();render()},()=>{});
  db.collection('items').onSnapshot(snap=>{Object.keys(XI).forEach(k=>delete XI[k]);snap.docs.forEach(d=>{const c=cleanItem(d.data());if(c)XI[d.id]=c});applyOv()},()=>{});
  db.collection('extra').onSnapshot(snap=>{Object.keys(xv).forEach(k=>delete xv[k]);snap.docs.forEach(d=>{const t=d.data()?.text;if(typeof t==='string')xv[d.id]=t});render()},()=>{});
})();
addEventListener('hashchange',route);route();
</script></body></html>
